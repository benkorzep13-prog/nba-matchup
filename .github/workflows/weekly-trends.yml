name: weekly-trends
on:
  schedule:
    - cron: "30 9 * * 1"
  workflow_dispatch:
jobs:
  retest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test core/engine.test.mjs
      - run: echo "FDR re-test needs the historical sample. No tier was promoted."
