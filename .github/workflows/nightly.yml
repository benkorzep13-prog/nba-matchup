name: nightly
on:
  schedule:
    - cron: "10 8 * * *"
  workflow_dispatch:
jobs:
  refit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: protocol only
        run: node --test core/engine.test.mjs
      - name: note
        run: echo "Backfill is not loaded. Ratings stay on priors."
